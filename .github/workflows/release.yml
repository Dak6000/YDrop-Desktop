name: Release Windows

on:
  push:
    tags: ['v*']          # ex. git tag v1.1.0 && git push origin v1.1.0
  workflow_dispatch:      # ou bouton « Run workflow » sur GitHub

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances (3 tentatives)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Tentative $i échouée, nouvel essai dans 15 s..."
            Start-Sleep -Seconds 15
          }
          exit 1

      # bin/ n'est pas versionné : on récupère les binaires pendant le build
      - name: Télécharger yt-dlp, ffmpeg et ffprobe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bin/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $d = Get-ChildItem ff -Directory | Select-Object -First 1
          Copy-Item "$($d.FullName)\bin\ffmpeg.exe", "$($d.FullName)\bin\ffprobe.exe" bin\

      - name: Build + publication de la release (3 tentatives)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npx electron-builder --win --publish always
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Tentative $i échouée, nouvel essai dans 20 s..."
            Start-Sleep -Seconds 20
          }
          exit 1
